<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ImmunoKids - Salomatlik Sarguzashti</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      color: #333;
    }

    .decor {
      position: absolute;
      font-size: 4rem;
      opacity: 0.15;
      pointer-events: none;
    }
    .decor1 { top: 10%; left: 8%; transform: rotate(-15deg); }
    .decor2 { bottom: 15%; right: 10%; transform: rotate(25deg); }
    .decor3 { top: 40%; right: 15%; font-size: 5rem; }

    .container {
      width: 420px;
      max-width: 90%;
      padding: 45px 35px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 32px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 20px 50px rgba(100, 150, 255, 0.25);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .logo {
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fad0c4, #a1c4fd);
      
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -1px;
      text-shadow: 0 2px 10px rgba(161, 196, 253, 0.6);
    }

    .subtitle {
      font-size: 1.35rem;
      color: #555;
      margin-bottom: 40px;
      font-weight: 500;
    }

    .input-group {
      position: relative;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 18px 20px 18px 50px;
      border: none;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.55);
      font-size: 1.1rem;
      color: #444;
      transition: all 0.35s;
    }

    input:focus {
      outline: none;
      background: white;
      box-shadow: 0 0 0 4px rgba(161, 196, 253, 0.4);
      transform: scale(1.03);
    }

    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
      font-size: 1.4rem;
    }

    .btn {
      width: 100%;
      padding: 18px;
      margin-top: 20px;
      background: linear-gradient(90deg, #ff9a9e, #fad0c4);
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.4s;
      box-shadow: 0 10px 30px rgba(255, 154, 158, 0.4);
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 15px 40px rgba(255, 154, 158, 0.55);
    }

    .extra {
      margin-top: 25px;
      font-size: 1rem;
      color: #666;
    }

    .extra a {
      color: #e066a3;
      text-decoration: none;
      font-weight: 600;
    }

    .extra a:hover {
      text-decoration: underline;
    }

    .error {
      color: #e74c3c;
      font-size: 0.95rem;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="decor decor1">⭐</div>
  <div class="decor decor2">💉</div>
  <div class="decor decor3">❤️</div>

  <div class="container">
    <div class="logo">ImmunoKids</div>
    <div class="subtitle">Salomatlik sarguzashting boshlanmoqda! 🚀</div>

    <form id="loginForm">
      <div class="input-group">
        <i class="fas fa-id-card input-icon"></i>
        <input type="text" id="jshshr" placeholder="JSHSHR (14 ta raqam)" maxlength="14" required>
      </div>

      <div class="input-group">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="parol" placeholder="Parol" required>
      </div>

      <div id="errorMsg" class="error">JSHSHR yoki parol noto'g'ri!</div>

      <button type="submit" class="btn">Kirish</button>
    </form>

    <div class="extra">
      <a href="#">Parolni unutdingizmi?</a><br><br>
      Yangi? <a href="#">Ro'yxatdan o'tish</a>
    </div>
  </div>

  <script>
    // Bu yerda oddiy sinov uchun parol: "123456"
    // Haqiqiy loyihada backend/serverdan tekshiriladi!
    const TO_GRI_PAROL = "123456";

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault(); // sahifa yangilanmasligi uchun

      const jshshrInput = document.getElementById("jshshr").value.trim();
      const parolInput = document.getElementById("parol").value;
      const errorDiv = document.getElementById("errorMsg");

      // JSHSHR tekshiruvi: faqat 14 ta raqam bo'lishi kerak
      if (!/^\d{14}$/.test(jshshrInput)) {
        errorDiv.textContent = "JSHSHR 14 ta raqamdan iborat bo'lishi kerak!";
        errorDiv.style.display = "block";
        return;
      }

      // Parol tekshiruvi
      if (parolInput === TO_GRI_PAROL) {
        errorDiv.style.display = "none";
        alert("Xush kelibsiz! Tizimga muvaffaqiyatli kirdingiz 🎈");
        // Bu yerda haqiqiy loyihada: window.location.href = "dashboard.html"; yoki boshqa sahifaga o'tkazish
      } else {
        errorDiv.textContent = "JSHSHR yoki parol noto'g'ri!";
        errorDiv.style.display = "block";
      }
    });
  </script>

</body>
</html>
